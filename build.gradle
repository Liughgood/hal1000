plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.genhao'
version = '0.0.1-SNAPSHOT'
description = 'hal1000'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = file("frontend")

tasks.register('frontendInstall', Exec) {
    group = "frontend"
    description = "Install frontend dependencies."
    workingDir = frontendDir
    onlyIf { frontendDir.exists() }

    // Prefer 'npm install' so builds don't fail when package-lock.json is not in sync.
    commandLine "npm", "install", "--no-fund", "--no-audit"
}

tasks.register('frontendBuild', Exec) {
    group = "frontend"
    description = "Build frontend (Vite) into src/main/resources/static."
    workingDir = frontendDir
    onlyIf { frontendDir.exists() }
    dependsOn 'frontendInstall'
    commandLine "npm", "run", "build"
}

// Ensure backend resources include latest frontend build output
tasks.named('processResources') {
    dependsOn 'frontendBuild'
}
