spring:
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  application:
    name: hal1000
  datasource:
    url: jdbc:sqlite:${HAL1000_DB_PATH:./hal1000.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  tomcat:
    # Allow larger request bodies for multipart uploads (PDFs).
    max-swallow-size: 60MB

logging:
  level:
    org.hibernate.SQL: info

hal1000:
  auth:
    jwt-secret: ${HAL1000_AUTH_JWT_SECRET:}
    jwt-issuer: ${HAL1000_AUTH_JWT_ISSUER:hal1000}
    frontend-redirect-url: ${HAL1000_AUTH_FRONTEND_REDIRECT_URL:http://localhost:5173/}
    github-client-id: ${HAL1000_GITHUB_CLIENT_ID:}
    github-client-secret: ${HAL1000_GITHUB_CLIENT_SECRET:}
  llm:
    provider: ${HAL1000_LLM_PROVIDER:gemini}
    base-url: ${HAL1000_LLM_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${HAL1000_LLM_API_KEY:}
    model: ${HAL1000_LLM_MODEL:gemini-2.5-flash}
    timeout-seconds: ${HAL1000_LLM_TIMEOUT_SECONDS:60}
  rag:
    enabled: ${HAL1000_RAG_ENABLED:false}
    top-k: ${HAL1000_RAG_TOP_K:5}
    max-prompt-chars: ${HAL1000_RAG_MAX_PROMPT_CHARS:6000}
    chunk-size-chars: ${HAL1000_RAG_CHUNK_SIZE_CHARS:1200}
    chunk-overlap-chars: ${HAL1000_RAG_CHUNK_OVERLAP_CHARS:200}
    max-url-bytes: ${HAL1000_RAG_MAX_URL_BYTES:2000000}
    embedding-batch-size: ${HAL1000_RAG_EMBEDDING_BATCH_SIZE:16}
    embedding-max-response-bytes: ${HAL1000_RAG_EMBEDDING_MAX_RESPONSE_BYTES:8000000}
    embedding-retry-max-attempts: ${HAL1000_RAG_EMBEDDING_RETRY_MAX_ATTEMPTS:6}
    embedding-retry-base-delay-ms: ${HAL1000_RAG_EMBEDDING_RETRY_BASE_DELAY_MS:1000}
    embedding-retry-max-delay-ms: ${HAL1000_RAG_EMBEDDING_RETRY_MAX_DELAY_MS:30000}
    max-extract-chars: ${HAL1000_RAG_MAX_EXTRACT_CHARS:1000000}
    max-chunks: ${HAL1000_RAG_MAX_CHUNKS:2000}
    embedding-provider: ${HAL1000_RAG_EMBEDDING_PROVIDER:openai}
    embedding-model: ${HAL1000_RAG_EMBEDDING_MODEL:}
    embedding-base-url: ${HAL1000_RAG_EMBEDDING_BASE_URL:}
    embedding-api-key: ${HAL1000_RAG_EMBEDDING_API_KEY:}

